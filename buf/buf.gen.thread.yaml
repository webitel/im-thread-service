version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
    - file_option: go_package
      module: buf.build/googleapis/googleapis
  override:
    # Forces all generated files into a single Go package,
    # merging 'internal' and 'shared' protos into one directory.
    - file_option: go_package
      value: github.com/webitel/protos/gen/go/im/thread/v1;thread


plugins:
  - remote: buf.build/protocolbuffers/go:v1.34.1
    out: ../gen/go
    opt:
      - module=github.com/webitel/protos/gen/go/im

  - remote: buf.build/grpc/go:v1.5.1
    out: ../gen/go
    opt:
      - module=github.com/webitel/protos/gen/go/im

inputs:
  - git_repo: https://github.com/webitel/protos.git
    branch: main
    subdir: im
    depth: 1


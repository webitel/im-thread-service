version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
    - file_option: go_package
      module: buf.build/googleapis/googleapis
  override:
    # Forces all generated files into a single Go package,
    # merging 'internal' and 'shared' protos into one directory.
    - file_option: go_package
      value: github.com/webitel/im-thread-service/gen/go/thread/v1;thread

plugins:
  - local: protoc-gen-go
    out: ../gen/go
    opt:
      - module=github.com/webitel/im-thread-service/gen/go

  - local: protoc-gen-go-grpc
    out: ../gen/go
    opt:
      - module=github.com/webitel/im-thread-service/gen/go

inputs:
  - directory: ../../protos/im

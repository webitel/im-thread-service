name: Workflow (im-thread-service)
run-name: "im-thread-service@${{github.ref_name}}#${{github.run_number}} - ${{github.event.head_commit.message}}"

on:
  push:
    branches:
      - main

permissions: {contents: read}
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare
    uses: webitel/reusable-workflows/.github/workflows/golang-prepare.yml@v1.0.6
    with:
      development-branch: ${{ github.event.repository.default_branch }}
      triggered-branch: ${{ github.ref_name }}
  
  checks:
    name: Checks
    needs: [prepare]
    uses: webitel/reusable-workflows/.github/workflows/golang-checks.yml@v1.0.6
    permissions:
      contents: read
      actions: read
      security-events: write

  compile:
    name: Build
    needs: [prepare]
    uses: webitel/reusable-workflows/.github/workflows/golang-build.yml@v1.0.6
    with:
        binary-name: im-thread-service
        ldflags: >
            -s -w
            -X github.com/webitel/im-thread-service/cmd.version=${{ needs.prepare.outputs.version }}-${{ github.run_number }}
            -X github.com/webitel/im-thread-service/cmd.commit=${{ github.sha }}
            -X github.com/webitel/im-thread-service/cmd.branch=${{ github.ref_name }}
        
        version: ${{ needs.prepare.outputs.version }}
        version-build: ${{ github.run_number }}
        prerelease: ${{ github.event.repository.default_branch == github.ref_name && 'dev' || '' }}
        package-name: im-contact-service
        package-description: ${{ github.event.repository.description }}
        package-contents: |
            src=deploy/systemd/${{ vars.SERVICE_NAME }}.service dst=/etc/systemd/system/${{ vars.SERVICE_NAME }}.service type=config
        
        scripts: |
          preinstall: deploy/debian/preinst.sh
          postinstall: deploy/debian/postinst.sh
          preremove: deploy/debian/prerm.sh